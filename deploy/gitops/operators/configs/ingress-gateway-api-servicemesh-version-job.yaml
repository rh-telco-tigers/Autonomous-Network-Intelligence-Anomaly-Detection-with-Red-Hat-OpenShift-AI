apiVersion: v1
kind: ServiceAccount
metadata:
  name: ingress-gateway-api-servicemesh-version-fix
  namespace: openshift-ingress-operator
  annotations:
    argocd.argoproj.io/sync-wave: "24"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ingress-gateway-api-servicemesh-version-fix
  annotations:
    argocd.argoproj.io/sync-wave: "24"
rules:
  - apiGroups: ["apps"]
    resources:
      - deployments
    resourceNames:
      - ingress-operator
    verbs:
      - get
      - patch
      - update
  - apiGroups: ["operators.coreos.com"]
    resources:
      - subscriptions
    resourceNames:
      - servicemeshoperator3
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ingress-gateway-api-servicemesh-version-fix
  annotations:
    argocd.argoproj.io/sync-wave: "24"
subjects:
  - kind: ServiceAccount
    name: ingress-gateway-api-servicemesh-version-fix
    namespace: openshift-ingress-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ingress-gateway-api-servicemesh-version-fix
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ingress-gateway-api-servicemesh-version-fix
  namespace: openshift-ingress-operator
  annotations:
    argocd.argoproj.io/sync-wave: "25"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: ingress-gateway-api-servicemesh-version-fix
      containers:
        - name: patch-version
          image: quay.io/openshift/origin-cli:4.21
          command:
            - /bin/bash
            - -ec
          args:
            - |
              set -euo pipefail

              TARGET_CSV="servicemeshoperator3.v3.3.4"
              DEADLINE="$(( $(date +%s) + 300 ))"

              log() {
                echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] $*"
              }

              current_env="$(oc get deployment ingress-operator -n openshift-ingress-operator -o jsonpath='{range .spec.template.spec.containers[?(@.name=="ingress-operator")].env[?(@.name=="GATEWAY_API_OPERATOR_VERSION")]}{.value}{end}')"
              if [ "$current_env" != "$TARGET_CSV" ]; then
                log "Setting ingress-operator GATEWAY_API_OPERATOR_VERSION=$TARGET_CSV (was ${current_env:-<unset>})"
                oc set env deployment/ingress-operator -n openshift-ingress-operator GATEWAY_API_OPERATOR_VERSION="$TARGET_CSV" >/dev/null
              else
                log "ingress-operator already pinned to $TARGET_CSV"
              fi

              while true; do
                current_csv="$(oc get subscription servicemeshoperator3 -n openshift-operators -o jsonpath='{.spec.startingCSV}' 2>/dev/null || true)"
                if [ "$current_csv" = "$TARGET_CSV" ]; then
                  log "servicemeshoperator3 subscription already aligned to $TARGET_CSV"
                  exit 0
                fi

                log "Patching servicemeshoperator3 startingCSV to $TARGET_CSV (was ${current_csv:-<unset>})"
                oc patch subscription servicemeshoperator3 -n openshift-operators --type=merge -p "{\"spec\":{\"startingCSV\":\"$TARGET_CSV\"}}" >/dev/null || true

                if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                  log "Timed out waiting for ingress-operator to converge servicemeshoperator3 to $TARGET_CSV"
                  exit 1
                fi
                sleep 5
              done
