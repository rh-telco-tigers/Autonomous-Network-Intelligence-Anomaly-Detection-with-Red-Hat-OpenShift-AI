apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhoai-gateway-servicemesh-bootstrap
  namespace: redhat-ods-operator
  annotations:
    argocd.argoproj.io/sync-wave: "11"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhoai-gateway-servicemesh-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "11"
rules:
  - apiGroups: ["operators.coreos.com"]
    resources:
      - subscriptions
      - installplans
      - clusterserviceversions
    verbs:
      - get
      - list
      - watch
      - patch
      - delete
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - patch
      - update
  - apiGroups: ["gateway.networking.k8s.io"]
    resources:
      - gatewayclasses
      - gateways
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhoai-gateway-servicemesh-bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "11"
subjects:
  - kind: ServiceAccount
    name: rhoai-gateway-servicemesh-bootstrap
    namespace: redhat-ods-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhoai-gateway-servicemesh-bootstrap
