{{- if and .Values.components.shipwright.enabled .Values.openshift (not .Values.components.shipwright.skipOpenShiftBuildOperand) }}
{{- /*
  OpenShiftBuild Operand Configuration

  The OpenShift Builds operator requires this operand CR to deploy Shipwright components.
  After the operator subscription is installed, this CR triggers the creation of:
  - builds.shipwright.io CRD
  - buildruns.shipwright.io CRD
  - buildstrategies.shipwright.io CRD
  - clusterbuildstrategies.shipwright.io CRD

  Uses Helm hooks to ensure the operator has time to install before creating the operand.

  NOTE: On fresh installs (e.g., HyperShift), the CRD may not exist when Helm runs.
  Set components.shipwright.skipOpenShiftBuildOperand=true and let the installer create
  the operand after the CRD is available.
*/}}
apiVersion: operator.openshift.io/v1alpha1
kind: OpenShiftBuild
metadata:
  name: cluster
  labels:
    {{- include "kagenti.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "48"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  sharedResource:
    state: Enabled
  shipwright:
    build:
      state: Enabled
{{- end }}
