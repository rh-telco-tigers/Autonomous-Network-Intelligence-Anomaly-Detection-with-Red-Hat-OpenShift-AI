apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-service
  annotations:
    image.openshift.io/triggers: |-
      [
        {
          "from": {
            "kind": "ImageStreamTag",
            "name": "rca-service:latest"
          },
          "fieldPath": "spec.template.spec.containers[?(@.name==\"rca-service\")].image"
        }
      ]
