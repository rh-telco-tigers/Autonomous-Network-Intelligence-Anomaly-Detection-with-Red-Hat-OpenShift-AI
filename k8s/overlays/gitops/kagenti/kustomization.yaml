apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmGlobals:
  chartHome: ../../../base/kagenti/charts
helmCharts:
  - name: kagenti
    releaseName: kagenti
    namespace: kagenti-system
    valuesFile: values.yaml
resources:
  - kagenti-operator-trusted-ca.yaml
  - kiali-dashboard-sync.yaml
  - mlflow-oauth-proxy.yaml
  - otel-collector-mlflow-rolebindings.yaml
patches:
  - path: kagenti-backend-dashboard-config-patch.yaml
