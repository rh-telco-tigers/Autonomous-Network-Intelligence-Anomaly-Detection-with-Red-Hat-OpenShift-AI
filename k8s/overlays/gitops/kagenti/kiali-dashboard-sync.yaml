apiVersion: v1
kind: ServiceAccount
metadata:
  name: kiali-dashboard-sync
  namespace: kagenti-system
  annotations:
    argocd.argoproj.io/sync-wave: "20"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kiali-dashboard-sync
  annotations:
    argocd.argoproj.io/sync-wave: "20"
rules:
  - apiGroups: ["route.openshift.io"]
    resources:
      - routes
    verbs:
      - get
      - list
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - get
      - patch
      - update
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kiali-dashboard-sync
  annotations:
    argocd.argoproj.io/sync-wave: "20"
subjects:
  - kind: ServiceAccount
    name: kiali-dashboard-sync
    namespace: kagenti-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kiali-dashboard-sync
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kiali-dashboard-sync
  namespace: kagenti-system
  annotations:
    argocd.argoproj.io/sync-wave: "21"
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: kiali-dashboard-sync
      containers:
        - name: sync-kiali-dashboard
          image: quay.io/openshift/origin-cli:4.21
          command:
            - /bin/bash
            - -ec
          args:
            - |
              set -euo pipefail

              ROUTE_NAMESPACE="istio-system"
              ROUTE_NAME="kiali"
              CONFIGMAP_NAMESPACE="kagenti-system"
              CONFIGMAP_NAME="kagenti-ui-config"
              BACKEND_DEPLOYMENT="kagenti-backend"
              DEADLINE="$(( $(date +%s) + 600 ))"

              log() {
                echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] $*"
              }

              get_route_url() {
                local host
                host="$(oc get route "$ROUTE_NAME" -n "$ROUTE_NAMESPACE" -o jsonpath='{.spec.host}' 2>/dev/null || true)"
                if [ -n "$host" ]; then
                  printf 'https://%s' "$host"
                fi
              }

              KIALI_URL=""
              until [ -n "$KIALI_URL" ]; do
                KIALI_URL="$(get_route_url)"
                if [ -n "$KIALI_URL" ]; then
                  break
                fi
                if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                  log "Timed out waiting for Kiali route $ROUTE_NAMESPACE/$ROUTE_NAME"
                  exit 1
                fi
                log "Waiting for Kiali route $ROUTE_NAMESPACE/$ROUTE_NAME..."
                sleep 5
              done

              log "Publishing NETWORK_TRAFFIC_DASHBOARD_URL=$KIALI_URL into $CONFIGMAP_NAMESPACE/$CONFIGMAP_NAME"
              oc patch configmap "$CONFIGMAP_NAME" -n "$CONFIGMAP_NAMESPACE" --type=merge \
                -p "{\"data\":{\"NETWORK_TRAFFIC_DASHBOARD_URL\":\"$KIALI_URL\"}}" >/dev/null

              log "Restarting $CONFIGMAP_NAMESPACE/$BACKEND_DEPLOYMENT to pick up updated dashboard URLs"
              oc rollout restart deployment "$BACKEND_DEPLOYMENT" -n "$CONFIGMAP_NAMESPACE" >/dev/null
